<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('个人信息')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/admin :: side('profile')}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments/admin :: top('个人信息')}"></header>
        <main class="main">
            <div class="page-head">
                <div>
                    <h1>个人信息</h1>
                    <p class="page-desc">更新昵称、手机号和头像，或单独修改登录密码。</p>
                </div>
            </div>
            <p class="flash" th:if="${msg}" th:text="${msg}"></p>
            <div class="grid-2">
                <form class="panel" action="/admin/profile" method="post" enctype="multipart/form-data">
                    <h2>资料</h2>
                    <img class="avatar-lg" th:if="${loginUser != null and loginUser.img != null and @fmt.logoOk(loginUser.img)}" th:src="${loginUser.img}" alt="当前头像">
                    <label>昵称<input type="text" name="nickname" th:value="${loginUser.nickname}"></label>
                    <label>手机号<input type="text" name="phone" maxlength="11" th:value="${loginUser.phone}"></label>
                    <label class="upload">头像<input type="file" name="imgFile" accept="image/*"></label>
                    <button type="submit">保存资料</button>
                </form>
                <form class="panel" action="/admin/password" method="post">
                    <h2>修改密码</h2>
                    <label>原密码<input type="password" name="oldPassword" placeholder="原密码" required></label>
                    <label>新密码<input type="password" name="newPassword" placeholder="至少 6 位" required></label>
                    <button type="submit">修改密码</button>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
