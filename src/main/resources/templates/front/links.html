<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/front :: head('友链')}"></head>
<body>
<header th:replace="~{fragments/front :: navbar('links')}"></header>
<main class="wrap section">
    <h1 class="page-title">友链</h1>
    <div class="link-grid">
        <a class="panel link-card" th:each="link : ${links}" th:href="${link.siteUrl}" target="_blank" rel="noopener noreferrer">
            <span class="link-mark">
                <img alt="" hidden>
                <span th:text="${link.siteName != null and !#strings.isEmpty(link.siteName) ? #strings.substring(link.siteName,0,1) : '链'}">链</span>
            </span>
            <span class="link-copy">
                <h3 th:text="${link.siteName}">名称</h3>
                <p th:text="${link.siteDesc}">描述</p>
                <span class="muted" th:text="${link.siteUrl}">地址</span>
            </span>
        </a>
        <p class="muted" th:if="${links.isEmpty()}">还没有友链。</p>
    </div>
</main>
<footer th:replace="~{fragments/front :: foot}"></footer>
<script>
    (function () {
        var cards = document.querySelectorAll(".link-card");
        Array.prototype.forEach.call(cards, function (card) {
            var img = card.querySelector(".link-mark img");
            var letter = card.querySelector(".link-mark span");
            if (!img || !letter) return;
            var origin = "";
            try { origin = new URL(card.href).origin; } catch (e) { origin = ""; }
            if (!origin || origin === "null") return;
            img.addEventListener("load", function () {
                if (!img.naturalWidth) return;
                img.hidden = false;
                letter.hidden = true;
            });
            img.addEventListener("error", function () {
                img.hidden = true;
                letter.hidden = false;
            });
            img.src = origin + "/favicon.ico";
        });
    })();
</script>
</body>
</html>
