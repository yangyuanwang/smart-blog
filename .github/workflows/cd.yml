name: CD

# CI 通过后构建镜像推送到 GHCR；SSH 部署在仓库 Secrets 配齐后自动生效
# 需要配置的 Secrets：
#   DEPLOY_HOST     服务器 IP 或域名
#   DEPLOY_USER     SSH 用户
#   DEPLOY_SSH_KEY  SSH 私钥（完整 PEM）
#   DEPLOY_PATH     服务器上的项目目录（如 /opt/smart-blog）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: 构建并推送镜像到 GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-blog-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-blog-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH 部署到服务器（配置 Secrets 后启用）
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # Secrets 未配置时自动跳过，镜像仅保留在 GHCR
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose --profile full pull
            docker compose --profile full up -d --no-deps backend frontend
            docker image prune -f
