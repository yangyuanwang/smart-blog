<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台登录</title>
    <link rel="stylesheet" th:href="@{/css/admin.css(v=13)}">
</head>
<body>
<main class="auth">
    <h1>后台登录</h1>
    <p class="muted">使用管理员账号进入智序工作台。</p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>
    <form class="stack" action="/admin/login" method="post">
        <label>用户名<input type="text" name="username" placeholder="用户名" required></label>
        <label>密码<input type="password" name="password" placeholder="密码" required></label>
        <label>验证码
            <span class="captcha">
                <input type="text" name="code" placeholder="验证码" maxlength="4" required>
                <img src="/captcha" alt="验证码，点击换一张" onclick="this.src='/captcha?ts=' + Date.now()">
            </span>
        </label>
        <button type="submit">登录</button>
    </form>
    <p class="muted"><a href="/">回前台</a></p>
</main>
</body>
</html>
