<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/front :: head('注册')}"></head>
<body>
<a class="auth-brand" href="/">
    <span th:text="${site['site_name'] ?: '智序'}">智序</span>
    <small>SMART WORKSPACE</small>
</a>
<main class="auth">
    <div class="auth-glass">
        <h1>注册</h1>
        <p class="auth-lead">注册后可以用昵称留言和评论</p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="empty" th:if="${!open}">注册已关闭。</p>
        <form class="reply" th:if="${open}" action="/register" method="post">
            <label>用户名
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>昵称
                <input type="text" name="nickname" placeholder="可不填">
            </label>
            <label>手机号
                <input type="text" name="phone" maxlength="11" placeholder="用于重置密码">
            </label>
            <label>密码
                <input type="password" name="password" autocomplete="new-password" placeholder="至少 6 位" required>
            </label>
            <label>验证码
                <span class="captcha">
                    <input type="text" name="code" maxlength="4" autocomplete="off" required>
                    <img src="/captcha" alt="验证码，点击换一张" onclick="this.src='/captcha?ts=' + Date.now()">
                </span>
            </label>
            <button type="submit">注册</button>
        </form>
        <nav class="auth-links">
            <a href="/login">已有账号，去登录</a>
        </nav>
    </div>
</main>
</body>
</html>
