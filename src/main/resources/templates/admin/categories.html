<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('栏目')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/admin :: side('category')}"></aside>
    <main class="main">
        <div th:replace="~{fragments/admin :: top}"></div>
        <h1>栏目和标签</h1>
        <p class="flash" th:if="${msg}" th:text="${msg}"></p>
        <div class="grid-2">
            <form class="panel" action="/admin/categories" method="post" style="display:grid;gap:8px">
                <h2>新增栏目</h2>
                <input type="text" name="cname" placeholder="栏目名称" required>
                <button type="submit">添加</button>
            </form>
            <form class="panel" action="/admin/tags" method="post" style="display:grid;gap:8px">
                <h2>新增标签</h2>
                <select name="cid" required>
                    <option th:each="category : ${categories}" th:value="${category.cid}" th:text="${category.cname}"></option>
                </select>
                <input type="text" name="tname" placeholder="标签名称" required>
                <button type="submit">添加</button>
            </form>
        </div>
        <table style="margin-top:16px">
            <thead><tr><th>栏目</th><th>文章</th><th>标签</th><th></th></tr></thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.cname}">栏目</td>
                <td th:text="${category.articleCount}">0</td>
                <td>
                    <div th:each="item : ${tags}" th:if="${item.cid == category.cid}" class="inline" style="margin-bottom:6px">
                        <span th:text="${item.tname}">标签</span>
                        <form th:action="@{/admin/tags/delete}" method="post">
                            <input type="hidden" name="tid" th:value="${item.tid}">
                            <button class="danger" type="submit">删除</button>
                        </form>
                    </div>
                </td>
                <td>
                    <form th:action="@{/admin/categories/delete}" method="post" onsubmit="return confirm('删除栏目会同时删除它的标签')">
                        <input type="hidden" name="cid" th:value="${category.cid}">
                        <button class="danger" type="submit">删除栏目</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </main>
</div>
</body>
</html>
