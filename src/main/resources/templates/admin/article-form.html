<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('文章')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/admin :: side('article')}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments/admin :: top('文章管理')}"></header>
        <main class="main">
            <div class="page-head">
                <div>
                    <h1 th:text="${article.aid == null ? '写文章' : '编辑文章'}">写文章</h1>
                    <p class="page-desc">填写标题、栏目和正文。正文按 Markdown 保存。</p>
                </div>
                <a class="btn line" href="/admin/articles">返回列表</a>
            </div>
            <p class="flash" th:if="${msg}" th:text="${msg}"></p>
            <form class="panel form-narrow" th:action="@{/admin/articles/save}" method="post" enctype="multipart/form-data">
                <input th:if="${article.aid != null}" type="hidden" name="aid" th:value="${article.aid}">
                <label class="field-title">标题<input type="text" name="title" th:value="${article.title}" required></label>
                <label>栏目
                    <select name="cid" id="cid" required>
                        <option value="">请选择</option>
                        <option th:each="category : ${categories}" th:value="${category.cid}" th:text="${category.cname}"
                                th:selected="${category.cid == article.cid}"></option>
                    </select>
                </label>
                <div>
                    <div class="muted">标签</div>
                    <div class="tags" id="tag-box">
                        <label class="tag-item" th:each="item : ${tags}" th:data-cid="${item.cid}">
                            <input type="checkbox" name="tags" th:value="${item.tname}"
                                   th:checked="${#lists.contains(@fmt.tags(article.tagNames), item.tname)}">
                            <span th:text="${item.tname}">标签</span>
                        </label>
                    </div>
                </div>
                <label>摘要<textarea name="digest" placeholder="留空时按正文自动生成" th:text="${article.digest}"></textarea></label>
                <label>正文<textarea class="editor" name="content" required th:text="${article.content}"></textarea></label>
                <div class="check">
                    <label><input type="radio" name="publishStatus" value="0" required th:checked="${article.publishStatus == '0'}"> 存草稿</label>
                    <label><input type="radio" name="publishStatus" value="1" required th:checked="${article.publishStatus == '1'}"> 已发布</label>
                    <label><input type="radio" name="publishStatus" value="2" required th:checked="${article.publishStatus == '2'}"> 已下线</label>
                    <label><input type="checkbox" name="isHot" value="1" th:checked="${article.isHot == 1}"> 热门</label>
                    <label><input type="checkbox" name="isTop" value="1" th:checked="${article.isTop == 1}"> 置顶</label>
                </div>
                <p class="muted">新建文章默认是草稿，访客看不到。要公开请改选「已发布」再保存。热门和置顶互不影响。草稿也要填写标题和正文。</p>
                <label>SEO 标题<input type="text" name="seoTitle" maxlength="255" th:value="${article.seoTitle}" placeholder="留空则使用文章标题"></label>
                <label>SEO 关键词<input type="text" name="seoKeywords" maxlength="255" th:value="${article.seoKeywords}" placeholder="留空则不输出关键词标签"></label>
                <label>SEO 描述<textarea name="seoDesc" maxlength="500" th:text="${article.seoDesc}" placeholder="留空则不输出描述标签"></textarea></label>
                <p class="muted">这三项只影响文章详情页的浏览器标题和 meta。正文里的大标题始终用上面的文章标题。</p>
                <label class="upload">封面
                    <input type="file" name="logoFile" accept="image/*">
                    <span th:if="${@fmt.logoOk(article.logo)}">当前封面：<span th:text="${article.logo}"></span></span>
                </label>
                <div class="tools">
                    <button type="submit">保存</button>
                    <a class="btn line" href="/admin/articles">取消</a>
                </div>
            </form>
        </main>
    </div>
</div>
<script>
    var cid = document.getElementById("cid");
    function filterTags() {
        var value = cid.value;
        document.querySelectorAll(".tag-item").forEach(function (el) {
            var match = value && el.getAttribute("data-cid") === value;
            el.style.display = match ? "" : "none";
            var input = el.querySelector("input");
            if (input) input.disabled = !match;
        });
    }
    cid.addEventListener("change", filterTags);
    filterTags();
</script>
</body>
</html>
