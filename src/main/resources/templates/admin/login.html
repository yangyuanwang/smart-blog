<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台登录</title>
    <link rel="stylesheet" th:href="@{/css/admin.css(v=3)}">
</head>
<body>
<main class="auth">
    <h1>后台登录</h1>
    <p class="muted">管理员进入文章、栏目、评论和站点设置。</p>
    <p class="flash error" th:if="${error}" th:text="${error}"></p>
    <form class="stack" action="/admin/login" method="post" style="display:grid;gap:10px">
        <input type="text" name="username" placeholder="用户名" required>
        <input type="password" name="password" placeholder="密码" required>
        <div class="captcha">
            <input type="text" name="code" placeholder="验证码" maxlength="4" required>
            <img src="/captcha" alt="验证码" onclick="this.src='/captcha?ts=' + Date.now()">
        </div>
        <button type="submit">登录</button>
    </form>
    <p class="muted"><a href="/">回前台</a></p>
</main>
</body>
</html>
