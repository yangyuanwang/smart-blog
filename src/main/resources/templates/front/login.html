<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/front :: head('登录')}"></head>
<body>
<a class="auth-brand" href="/" th:text="${site['site_name'] ?: '智能博客'}">智能博客</a>
<main class="auth">
    <div class="auth-glass">
        <h1>登录</h1>
        <p class="auth-lead">欢迎回来，请输入你的账户信息</p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="flash" th:if="${msg}" th:text="${msg}"></p>
        <form class="reply" action="/login" method="post">
            <label>用户名
                <input type="text" name="username" autocomplete="username" required>
            </label>
            <label>密码
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <label>验证码
                <span class="captcha">
                    <input type="text" name="code" maxlength="4" autocomplete="off" required>
                    <img src="/captcha" alt="验证码，点击换一张" onclick="this.src='/captcha?ts=' + Date.now()">
                </span>
            </label>
            <button type="submit">登录</button>
        </form>
        <nav class="auth-links">
            <a href="/register">注册账号</a>
            <a href="/reset">重置密码</a>
        </nav>
    </div>
</main>
</body>
</html>
