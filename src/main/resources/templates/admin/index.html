<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('总览')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/admin :: side('dash')}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments/admin :: top('总览')}"></header>
        <main class="main">
            <div class="page-head">
                <div>
                    <h1>总览</h1>
                    <p class="page-desc">查看现有内容规模、登录记录和运行环境。</p>
                </div>
            </div>
            <p class="flash" th:if="${msg}" th:text="${msg}"></p>
            <section class="stats" aria-label="内容统计">
                <div class="stat"><b th:text="${articleCount}">0</b><span>文章</span></div>
                <div class="stat"><b th:text="${publicCount}">0</b><span>公开文章</span></div>
                <div class="stat"><b th:text="${commentCount}">0</b><span>评论</span></div>
                <div class="stat"><b th:text="${messageCount}">0</b><span>已通过顶层留言</span></div>
                <div class="stat"><b th:text="${linkCount}">0</b><span>友链</span></div>
                <div class="stat"><b th:text="${visitCount}">0</b><span>访问量</span></div>
            </section>
            <section class="section">
                <h2>登录与环境</h2>
                <div class="panel brief">
                    <p th:if="${loginUser != null}"><b>上次登录</b><span th:text="${loginUser.lastLoginTime != null and loginUser.lastLoginTime != 'null' ? loginUser.lastLoginTime : '这是第一次'}">时间</span></p>
                    <p th:if="${loginUser != null}"><b>登录 IP</b><span th:text="${loginUser.loginIp != null and loginUser.loginIp != 'null' ? loginUser.loginIp : '—'}">ip</span></p>
                    <p th:if="${loginUser != null}"><b>登录次数</b><span th:text="${(loginUser.loginCount != null ? loginUser.loginCount : 0) + ' 次'}">次数</span></p>
                    <p class="env" th:text="|Java ${javaVersion} · ${osName} · MySQL blog|">系统</p>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
