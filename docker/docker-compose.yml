# 统一 compose：dev profile 只起依赖（日常开发），full profile 起全栈（联调/部署）
# 用法：
#   依赖:  docker compose -f docker/docker-compose.yml --profile dev up -d
#   全栈:  docker compose -f docker/docker-compose.yml --profile full up -d --build
services:
  mysql:
    profiles: [dev, full]
    image: mysql:8.0
    container_name: smart-blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blog123456}
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "33061:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    profiles: [dev, full]
    image: redis:7-alpine
    container_name: smart-blog-redis
    restart: unless-stopped
    ports:
      - "36379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: [full]
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: smart-blog-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blog123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-override-in-production-0123456789}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-glm-4-flash}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BLOG_UPLOAD_DIR: /app/uploads
      API_DOC_ENABLED: ${API_DOC_ENABLED:-false}
      # Knife4j 自动配置必须与 springdoc 同步开关，否则 API 文档关闭时启动失败
      KNIFE4J_ENABLE: ${API_DOC_ENABLED:-false}
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [full]
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: smart-blog-frontend
    environment:
      NUXT_API_ORIGIN: http://backend:8080
      NUXT_PROXY_TARGET: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  backend-uploads:
