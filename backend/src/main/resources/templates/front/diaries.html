<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/front :: head('日记')}"></head>
<body>
<header th:replace="~{fragments/front :: navbar('diaries')}"></header>
<main class="sheet">
    <header class="list-head">
        <div>
            <h1>日记</h1>
        </div>
    </header>
    <div class="stream">
        <article class="entry" th:each="item : ${diaries}">
            <div>
                <p class="entry-kicker">
                    <span th:text="${item.createTime}">时间</span>
                    <span th:if="${item.mood != null and !item.mood.isEmpty()}" th:text="${item.mood}">心情</span>
                </p>
                <h2 th:text="${item.title}">标题</h2>
                <p class="plain" th:text="${item.content}">内容</p>
            </div>
        </article>
        <p class="empty" th:if="${diaries.isEmpty()}">还没有日记。</p>
    </div>
</main>
<footer th:replace="~{fragments/front :: foot}"></footer>
</body>
</html>
