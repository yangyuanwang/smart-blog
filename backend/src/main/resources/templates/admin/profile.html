<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('个人信息')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/admin :: side('profile')}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments/admin :: top('个人信息')}"></header>
        <main class="main">
            <div class="page-head">
                <div>
                    <h1>个人信息</h1>
                    <p class="page-desc">更新昵称、手机号和头像，或单独修改登录密码。</p>
                </div>
            </div>
            <p class="flash" th:if="${msg}" th:text="${msg}"></p>
            <div class="profile-grid">
                <form class="panel profile-card profile-details" action="/admin/profile" method="post" enctype="multipart/form-data">
                    <div class="profile-card-head">
                        <span class="profile-symbol" aria-hidden="true">01</span>
                        <div><h2>基本资料</h2><p>让个人资料保持准确，方便识别与联系。</p></div>
                    </div>
                    <div class="profile-avatar-row">
                        <img class="avatar-lg" th:if="${loginUser != null and loginUser.img != null and @fmt.logoOk(loginUser.img)}" th:src="${loginUser.img}" alt="当前头像">
                        <span class="avatar-lg avatar-placeholder" th:unless="${loginUser != null and loginUser.img != null and @fmt.logoOk(loginUser.img)}" th:text="${#strings.substring((loginUser.nickname != null and !#strings.isEmpty(loginUser.nickname) and loginUser.nickname != 'null') ? loginUser.nickname : loginUser.username, 0, 1)}">管</span>
                        <div><strong th:text="${loginUser.nickname}">管理员</strong><span>账户资料</span></div>
                    </div>
                    <label>昵称<input type="text" name="nickname" th:value="${loginUser.nickname}"></label>
                    <label>手机号<input type="text" name="phone" maxlength="11" th:value="${loginUser.phone}"></label>
                    <label class="upload profile-upload"><span>更换头像</span><small>支持常见图片格式</small><input type="file" name="imgFile" accept="image/*"></label>
                    <button type="submit">保存资料 <span aria-hidden="true">→</span></button>
                </form>
                <form class="panel profile-card profile-security" action="/admin/password" method="post">
                    <div class="profile-card-head">
                        <span class="profile-symbol" aria-hidden="true">02</span>
                        <div><h2>登录安全</h2><p>定期更新密码，保护你的工作空间。</p></div>
                    </div>
                    <label>原密码<input type="password" name="oldPassword" placeholder="原密码" required></label>
                    <label>新密码<input type="password" name="newPassword" placeholder="至少 6 位" required></label>
                    <button type="submit">更新密码 <span aria-hidden="true">→</span></button>
                </form>
            </div>
        </main>
    </div>
</div>
</body>
</html>
