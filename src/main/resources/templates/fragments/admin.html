<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' · 后台'}">后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css(v=15)}">
</head>
<body>
<aside th:fragment="side(active)" class="side">
    <div class="side-head">
        <a class="brand" href="/admin">
            <span class="brand-mark" aria-hidden="true">序</span>
            <span class="brand-copy">
                <span class="brand-name">智序</span>
                <span class="brand-en">SMART WORKSPACE</span>
            </span>
        </a>
        <button class="side-fold" type="button" aria-label="折叠侧栏" title="折叠侧栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M15 6 9 12l6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <p class="nav-label">工作空间</p>
    <a class="nav-item" href="/admin" data-label="总览" title="总览" th:classappend="${active == 'dash'} ? 'on'" th:attr="aria-current=${active == 'dash'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.4"/><rect x="13.5" y="11" width="7" height="9.5" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
        <span class="nav-text">总览</span>
    </a>
    <a class="nav-item" href="/admin/articles" data-label="文章" title="文章" th:classappend="${active == 'article'} ? 'on'" th:attr="aria-current=${active == 'article'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.8V9h5.2M8.5 13h7M8.5 16.5h5"/></svg>
        <span class="nav-text">文章</span>
    </a>
    <a class="nav-item" href="/admin/notices" data-label="公告" title="公告" th:classappend="${active == 'notice'} ? 'on'" th:attr="aria-current=${active == 'notice'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 10.5v3l-1.2 2.2A1 1 0 0 0 4.7 17H8"/><path d="M8 8.5a5 5 0 0 1 8.5-3.5L20 8.5V15l-3.5 3.5A5 5 0 0 1 8 15.5z"/></svg>
        <span class="nav-text">公告</span>
    </a>
    <a class="nav-item" href="/admin/comments" data-label="评论" title="评论" th:classappend="${active == 'comment'} ? 'on'" th:attr="aria-current=${active == 'comment'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 6.5h12a1.5 1.5 0 0 1 1.5 1.5v6.5A1.5 1.5 0 0 1 18 16H10l-4 3.2V16H6a1.5 1.5 0 0 1-1.5-1.5V8A1.5 1.5 0 0 1 6 6.5z"/></svg>
        <span class="nav-text">评论</span>
    </a>
    <a class="nav-item" href="/admin/messages" data-label="留言" title="留言" th:classappend="${active == 'message'} ? 'on'" th:attr="aria-current=${active == 'message'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 7h10.5A1.5 1.5 0 0 1 17 8.5V13a1.5 1.5 0 0 1-1.5 1.5H9l-3 2.4V14.5H5A1.5 1.5 0 0 1 3.5 13V8.5A1.5 1.5 0 0 1 5 7z"/><path d="M8 17.2V18a1.5 1.5 0 0 0 1.5 1.5H15l3 2.4V19.5h.5A1.5 1.5 0 0 0 20 18v-4.5"/></svg>
        <span class="nav-text">留言</span>
        <span class="nav-badge" th:if="${pendingMessages > 0}" th:text="${pendingMessages > 99 ? '99+' : pendingMessages}">1</span>
    </a>
    <a class="nav-item" href="/admin/diaries" data-label="日记" title="日记" th:classappend="${active == 'diary'} ? 'on'" th:attr="aria-current=${active == 'diary'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="4.5" y="5" width="15" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4.5 10h15"/></svg>
        <span class="nav-text">日记</span>
    </a>
    <a class="nav-item" href="/admin/categories" data-label="栏目" title="栏目" th:classappend="${active == 'category'} ? 'on'" th:attr="aria-current=${active == 'category'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7.5h5l2 2H20a1 1 0 0 1 1 1V18a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 4 18z"/></svg>
        <span class="nav-text">栏目</span>
    </a>
    <a class="nav-item" href="/admin/links" data-label="友链" title="友链" th:classappend="${active == 'link'} ? 'on'" th:attr="aria-current=${active == 'link'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M10 13a4 4 0 0 0 5.7.4l1.4-1.4a4 4 0 0 0-5.7-5.7L10.2 7.5"/><path d="M14 11a4 4 0 0 0-5.7-.4L6.9 12a4 4 0 0 0 5.7 5.7l1.2-1.2"/></svg>
        <span class="nav-text">友链</span>
    </a>
    <p class="nav-label">系统管理</p>
    <a class="nav-item" href="/admin/users" data-label="用户" title="用户" th:classappend="${active == 'user'} ? 'on'" th:attr="aria-current=${active == 'user'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.8 19a5.2 5.2 0 0 1 10.4 0"/><circle cx="17" cy="9" r="2.2"/><path d="M16.2 14.2A4.4 4.4 0 0 1 21 18.5"/></svg>
        <span class="nav-text">用户</span>
    </a>
    <a class="nav-item" href="/admin/logs" data-label="登录日志" title="登录日志" th:classappend="${active == 'log'} ? 'on'" th:attr="aria-current=${active == 'log'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4.5h8M8 9h8M8 13.5h5"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
        <span class="nav-text">登录日志</span>
    </a>
    <a class="nav-item" href="/admin/settings" data-label="设置" title="设置" th:classappend="${active == 'setting'} ? 'on'" th:attr="aria-current=${active == 'setting'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18"/></svg>
        <span class="nav-text">设置</span>
    </a>
    <a class="nav-item" href="/admin/profile" data-label="个人信息" title="个人信息" th:classappend="${active == 'profile'} ? 'on'" th:attr="aria-current=${active == 'profile'} ? 'page' : null">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19.2a7 7 0 0 1 14 0"/></svg>
        <span class="nav-text">个人信息</span>
    </a>
</aside>
<header th:fragment="top(crumb)" class="topbar">
    <div class="drawer-mask"></div>
    <div class="crumb">
        <button class="nav-open" type="button" aria-label="打开菜单">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
        </button>
        <span>后台管理</span>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <strong th:text="${crumb}">页面</strong>
    </div>
    <div class="top-tools">
        <a class="top-link" href="/">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M14 5h5v5"/><path d="M10 14 19 5"/><path d="M19 13.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5.5"/></svg>
            前台
        </a>
        <details class="user-menu" th:if="${loginUser != null}">
            <summary class="user-trigger">
                <img class="avatar" th:if="${loginUser.img != null and @fmt.logoOk(loginUser.img)}" th:src="${loginUser.img}" alt="">
                <span class="avatar-fallback" th:unless="${loginUser.img != null and @fmt.logoOk(loginUser.img)}" aria-hidden="true"
                      th:text="${#strings.substring((loginUser.nickname != null and !#strings.isEmpty(loginUser.nickname) and loginUser.nickname != 'null') ? loginUser.nickname : loginUser.username, 0, 1)}">管</span>
                <span class="user-name" th:text="${(loginUser.nickname != null and !#strings.isEmpty(loginUser.nickname) and loginUser.nickname != 'null') ? loginUser.nickname : loginUser.username}">管理员</span>
                <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5.2 7 9l4-3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </summary>
            <div class="user-drop">
                <a href="/admin/profile">个人信息</a>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" name="next" value="/admin/login">
                    <button class="danger" type="submit">退出登录</button>
                </form>
            </div>
        </details>
    </div>
    <script>
        (function () {
            var shell = document.querySelector(".shell");
            if (!shell) return;
            var key = "admin-side-collapsed";
            var narrow = function () { return window.matchMedia("(max-width: 980px)").matches; };
            try {
                if (!narrow() && localStorage.getItem(key) === "1") shell.classList.add("is-collapsed");
            } catch (e) {}
            var fold = document.querySelector(".side-fold");
            var syncFold = function () {
                if (!fold) return;
                var collapsed = !narrow() && shell.classList.contains("is-collapsed");
                var label = collapsed ? "展开侧栏" : "折叠侧栏";
                fold.setAttribute("aria-label", label);
                fold.setAttribute("title", label);
            };
            syncFold();
            if (fold) {
                fold.addEventListener("click", function () {
                    if (narrow()) {
                        shell.classList.remove("is-drawer");
                        return;
                    }
                    shell.classList.toggle("is-collapsed");
                    try { localStorage.setItem(key, shell.classList.contains("is-collapsed") ? "1" : "0"); } catch (e) {}
                    syncFold();
                });
            }
            var opener = document.querySelector(".nav-open");
            if (opener) {
                opener.addEventListener("click", function () { shell.classList.add("is-drawer"); });
            }
            var mask = document.querySelector(".drawer-mask");
            if (mask) {
                mask.addEventListener("click", function () { shell.classList.remove("is-drawer"); });
            }
            document.addEventListener("click", function (event) {
                var nodes = document.querySelectorAll("details[open]");
                for (var i = 0; i < nodes.length; i++) {
                    if (!nodes[i].contains(event.target)) nodes[i].removeAttribute("open");
                }
            });
            document.addEventListener("keydown", function (event) {
                if (event.key !== "Escape") return;
                shell.classList.remove("is-drawer");
                var nodes = document.querySelectorAll("details[open]");
                for (var i = 0; i < nodes.length; i++) nodes[i].removeAttribute("open");
            });
            document.addEventListener("toggle", function (event) {
                var menu = event.target.querySelector && event.target.querySelector(".more-menu");
                if (!menu || !event.target.open) return;
                var summary = event.target.querySelector("summary");
                if (!summary) return;
                var rect = summary.getBoundingClientRect();
                menu.style.position = "fixed";
                menu.style.right = "auto";
                menu.style.zIndex = "60";
                var width = menu.offsetWidth || 148;
                var left = Math.max(8, rect.right - width);
                var top = rect.bottom + 4;
                if (top + menu.offsetHeight > window.innerHeight - 8) top = Math.max(8, rect.top - menu.offsetHeight - 4);
                menu.style.left = left + "px";
                menu.style.top = top + "px";
            }, true);
        })();
    </script>
</header>
</body>
</html>
