<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin :: head('个人信息')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/admin :: side('profile')}"></aside>
    <main class="main">
        <div th:replace="~{fragments/admin :: top}"></div>
        <h1>个人信息</h1>
        <p class="flash" th:if="${msg}" th:text="${msg}"></p>
        <div class="grid-2">
            <form class="panel" action="/admin/profile" method="post" enctype="multipart/form-data" style="display:grid;gap:8px">
                <label>昵称<input type="text" name="nickname" th:value="${loginUser.nickname}"></label>
                <label>手机号<input type="text" name="phone" maxlength="11" th:value="${loginUser.phone}"></label>
                <label>头像<input type="file" name="imgFile" accept="image/*"></label>
                <button type="submit">保存资料</button>
            </form>
            <form class="panel" action="/admin/password" method="post" style="display:grid;gap:8px">
                <h2>修改密码</h2>
                <input type="password" name="oldPassword" placeholder="原密码" required>
                <input type="password" name="newPassword" placeholder="新密码" required>
                <button type="submit">修改密码</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
